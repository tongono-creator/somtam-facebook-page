name: Somtam Bot

on:
  schedule:
    - cron: "0 3 * * *"   # 10:00 BKK
    - cron: "0 13 * * *"  # 20:00 BKK
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode to run (default, dilemma, recipe, contrast_review, trivia)'
        required: false
        default: 'default'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install google-genai requests openpyxl Pillow
      - name: Run bot
        env:
          SOMTAM_PAGE_ACCESS_TOKEN: ${{ secrets.SOMTAM_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "${{ inputs.mode }}" ] && [ "${{ inputs.mode }}" != "default" ]; then
            python somtam.py --mode=${{ inputs.mode }}
          else
            python somtam.py
          fi

      - name: Commit and push if history updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python merge_history.py
